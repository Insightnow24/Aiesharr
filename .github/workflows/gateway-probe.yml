name: Temporary Hintonship Worker Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe likely workers.dev endpoints
        shell: bash
        run: |
          set +e
          worker_names=(
            hintonship-storage-gateway
            hintonship
          )
          account_subdomains=(
            insightnow24
            insight-now24
            insightnow-24
            insightnow24-gmail
            insightnow24-gmail-com
            insightnow24gmailcom
            burdenbearerservices
            burdenbearer-services
            burdenbearerservices-projects
            burdenbearer-services-projects
            amberwilder
            amber-wilder
            hintonship
          )

          found=0
          for worker in "${worker_names[@]}"; do
            for account in "${account_subdomains[@]}"; do
              url="https://${worker}.${account}.workers.dev/v1/health"
              echo "PROBE ${url}"
              body_file="$(mktemp)"
              code=$(curl --silent --show-error --location --max-time 12 --output "$body_file" --write-out '%{http_code}' "$url" 2>&1)
              status=$?
              body=$(cat "$body_file" 2>/dev/null | tr '\n' ' ' | head -c 600)
              rm -f "$body_file"
              echo "RESULT curl_status=${status} http=${code} body=${body}"
              if [[ "$status" == "0" && "$code" == "200" && "$body" == *'cloudflare-worker-r2-binding'* ]]; then
                echo "FOUND_GATEWAY_URL=${url%/v1/health}"
                found=1
                break 2
              fi
            done
          done

          if [[ "$found" != "1" ]]; then
            echo "No candidate matched."
            exit 2
          fi
