name: Build Forge 90 Watch Bridge

on:
  push:
    branches:
      - forge90-watch-bridge-build-20260828
    paths:
      - 'forge90-watch-bridge/**'
      - '.github/workflows/forge90-watch-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android API 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: forge90-watch-bridge
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK to branch
        run: |
          cp forge90-watch-bridge/app/build/outputs/apk/debug/app-debug.apk forge90-watch-bridge.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge90-watch-bridge.apk
          git commit -m 'Publish Forge 90 Watch Bridge APK' || true
          git push
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge90-watch-bridge-apk
          path: forge90-watch-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
