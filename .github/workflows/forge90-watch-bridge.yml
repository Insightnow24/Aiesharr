name: Build Forge 90 Watch Bridge

on:
  push:
    branches:
      - forge90-watch-bridge-build-20260828
    paths:
      - 'forge90v2-src.part*'
      - '.github/workflows/forge90-watch-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat forge90v2-src.part* > /tmp/forge90-watch-bridge.b64
          base64 -d /tmp/forge90-watch-bridge.b64 > /tmp/forge90-watch-bridge.tar.gz
          tar -xzf /tmp/forge90-watch-bridge.tar.gz
          test -f forge90-watch-bridge/gradle.properties
          grep -q 'android.useAndroidX=true' forge90-watch-bridge/gradle.properties
          grep -q '8.13.0' forge90-watch-bridge/build.gradle.kts
          grep -q 'compileSdk = 36' forge90-watch-bridge/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: forge90-watch-bridge
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK to branch
        run: |
          cp forge90-watch-bridge/app/build/outputs/apk/debug/app-debug.apk forge90-watch-bridge.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge90-watch-bridge.apk
          git commit -m 'Publish Forge 90 Watch Bridge APK' || true
          git push
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge90-watch-bridge-apk
          path: forge90-watch-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
