name: Temporary Hintonship Academy Live Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Hintonship production endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo 'HEALTH_RESPONSE_START'
          curl --silent --show-error --location --max-time 30 https://hintonship.com/health
          echo
          echo 'HEALTH_RESPONSE_END'

          echo 'BOOK_BUILDER_HEADERS_START'
          curl --silent --show-error --head --location --max-time 30 --max-redirs 5 https://hintonship.com/academy/book-course-builder
          echo 'BOOK_BUILDER_HEADERS_END'
